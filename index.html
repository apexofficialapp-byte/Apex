<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="APEX — Your Exam Partner. Student productivity and exam preparation.">
<title>APEX — Your Exam Partner</title>
<style>
:root{
  --bg:#f5f7fb;--surface:#fff;--surface2:#eef2f8;--text:#101828;--muted:#667085;
  --primary:#5b5ce2;--primary2:#4445c7;--success:#12b76a;--danger:#f04438;--warning:#f79009;
  --border:#e4e7ec;--shadow:0 10px 30px rgba(16,24,40,.07);--radius:20px;
}
[data-theme=dark]{
 --bg:#090d18;--surface:#111827;--surface2:#1a2233;--text:#f2f4f7;--muted:#98a2b3;
 --border:#293246;--shadow:0 10px 30px rgba(0,0,0,.25);
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
#app{min-height:100vh}.screen{max-width:1100px;margin:auto;padding:20px 16px 100px}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#e9e9ff,transparent 45%),var(--bg)}
.auth-card{width:min(440px,100%);background:var(--surface);padding:28px;border:1px solid var(--border);border-radius:28px;box-shadow:var(--shadow)}
.logo{font-weight:900;letter-spacing:-1px;font-size:32px}.tag{color:var(--muted);margin-top:4px}
.field{display:flex;flex-direction:column;gap:7px;margin:13px 0}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{
 width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:13px;background:var(--surface);color:var(--text);outline:none}
.field textarea{min-height:110px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,92,226,.12)}
.btn{padding:12px 16px;border-radius:13px;font-weight:800;transition:.15s}.btn:active{transform:scale(.98)}
.primary{background:var(--primary);color:#fff}.secondary{background:var(--surface2);color:var(--text)}.danger{background:#fee4e2;color:#b42318}.success{background:#d1fadf;color:#067647}.ghost{background:transparent;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}.between{display:flex;justify-content:space-between;gap:12px;align-items:center}.wrap{flex-wrap:wrap}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand-mini{font-weight:900;font-size:23px}.avatar{
 width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:#fff;font-weight:900;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}.iconbtn{width:42px;height:42px;border-radius:13px;background:var(--surface);border:1px solid var(--border);color:var(--text)}
.greeting{font-size:28px;letter-spacing:-1px;margin:4px 0}.muted{color:var(--muted)}.small{font-size:12px}.section{margin:22px 0}.section h2{font-size:18px;margin:0 0 12px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat .num{font-size:26px;font-weight:900;margin-top:5px}.stat .label{font-size:12px;color:var(--muted);font-weight:700}
.quick{display:flex;align-items:center;gap:12px}.quick .qicon{width:45px;height:45px;border-radius:14px;display:grid;place-items:center;background:var(--surface2);font-size:21px}
.progress{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--primary);border-radius:inherit}
.task{display:flex;gap:12px;align-items:flex-start}.check{width:24px;height:24px;border:2px solid var(--border);border-radius:8px;flex:none;background:transparent}.check.done{background:var(--success);border-color:var(--success);color:#fff}
.task-title{font-weight:800}.strike{text-decoration:line-through;opacity:.6}.badge{display:inline-flex;padding:5px 8px;border-radius:99px;background:var(--surface2);font-size:11px;font-weight:800}.badge.high{background:#fee4e2;color:#b42318}.badge.med{background:#fef0c7;color:#93370d}.badge.low{background:#d1fadf;color:#067647}
.list{display:flex;flex-direction:column;gap:10px}.empty{text-align:center;padding:30px 12px;color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.tab{padding:9px 13px;border-radius:99px;background:var(--surface2);white-space:nowrap;font-weight:750;color:var(--muted)}.tab.active{background:var(--primary);color:#fff}
.bottom{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--border);z-index:20;padding:8px max(8px,env(safe-area-inset-left)) max(8px,env(safe-area-inset-bottom))}
.nav{max-width:700px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{background:none;color:var(--muted);padding:6px 2px;font-size:11px;font-weight:800}.nav button.active{color:var(--primary)}.nav .ni{font-size:21px;display:block;margin-bottom:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:grid;place-items:end center;padding:12px}.modalbox{width:min(620px,100%);max-height:92vh;overflow:auto;background:var(--surface);border-radius:24px;padding:20px;border:1px solid var(--border)}
.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#101828;color:#fff;padding:11px 15px;border-radius:12px;z-index:80;box-shadow:var(--shadow);font-size:13px}
header.page{margin-bottom:18px}.page h1{font-size:28px;letter-spacing:-1px;margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}
.item-actions{display:flex;gap:6px;margin-left:auto}.item-actions button{padding:7px 9px;border-radius:9px;background:var(--surface2);color:var(--text);font-size:12px}
.calendar-note{font-size:12px;color:var(--muted);margin-top:4px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--border);font-size:13px}
@media(max-width:720px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}.screen{padding-top:14px}.greeting{font-size:25px}}
@media(min-width:900px){.bottom{position:sticky;top:0;bottom:auto;border:0;background:transparent;backdrop-filter:none;padding:0;margin:-20px auto 10px}.nav{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:5px;box-shadow:var(--shadow)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>
<script>
"use strict";

/* ============================================================
   APEX — SINGLE FILE LOCAL-FIRST APPLICATION
   No Google Login/OAuth/dependencies.
   Core data lives in localStorage. Passwords are PBKDF2 hashes,
   never plaintext. A production cloud backend is required for
   multi-device sync, email password reset, push notifications,
   and secure server-side admin authorization.
============================================================ */

const KEY="APEX_V1_STATE";
const VERSION="1.0.0";
const uid=()=>crypto.randomUUID?crypto.randomUUID():"id-"+Date.now()+"-"+Math.random().toString(36).slice(2);
const nowISO=()=>new Date().toISOString();
const localDate=d=>{const x=d?new Date(d):new Date();return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtMin=m=>{m=Math.max(0,Math.round(m||0));return `${Math.floor(m/60)}h ${m%60}m`};
const dateText=d=>new Intl.DateTimeFormat(undefined,{day:"numeric",month:"short",year:"numeric"}).format(new Date(d+"T00:00:00"));
const timeText=d=>new Intl.DateTimeFormat(undefined,{hour:"numeric",minute:"2-digit"}).format(new Date(d));
const subjectList=exam=>exam==="NEET"?["Physics","Chemistry","Biology"]:["Physics","Chemistry","Mathematics"];

let state=load();
let page="home";
let studySubject=null;

function defaultState(){
 return {
  version:VERSION,sessionUserId:null,theme:"system",
  users:[],tasks:[],backlog:[],sessions:[],notes:[],tests:[],attempts:[],
  xp:[],activities:[],achievements:[],notifications:[],referrals:[],
  curriculum:[
   {id:uid(),exam:"JEE",name:"Physics",chapters:[
    {id:uid(),name:"Units & Measurements",topics:["Dimensions","Errors","Significant Figures"]},
    {id:uid(),name:"Kinematics",topics:["Motion in Straight Line","Motion in Plane"]},
    {id:uid(),name:"Newton's Laws of Motion",topics:["NLM","Friction","Circular Motion"]},
    {id:uid(),name:"Work, Energy & Power",topics:["Work","Energy","Power"]}
   ]},
   {id:uid(),exam:"JEE",name:"Chemistry",chapters:[
    {id:uid(),name:"Some Basic Concepts",topics:["Mole Concept","Stoichiometry"]},
    {id:uid(),name:"Atomic Structure",topics:["Bohr Model","Quantum Numbers"]},
    {id:uid(),name:"Chemical Bonding",topics:["VSEPR","Hybridisation","MOT"]}
   ]},
   {id:uid(),exam:"JEE",name:"Mathematics",chapters:[
    {id:uid(),name:"Sets",topics:["Set Operations","Intervals"]},
    {id:uid(),name:"Logarithms",topics:["Laws","Equations"]},
    {id:uid(),name:"Quadratic Equations",topics:["Roots","Graphs"]}
   ]},
   {id:uid(),exam:"NEET",name:"Physics",chapters:[{id:uid(),name:"Units & Measurements",topics:["Dimensions","Errors"]},{id:uid(),name:"Kinematics",topics:["Motion","Vectors"]}]},
   {id:uid(),exam:"NEET",name:"Chemistry",chapters:[{id:uid(),name:"Some Basic Concepts",topics:["Mole Concept"]},{id:uid(),name:"Atomic Structure",topics:["Quantum Numbers"]}]},
   {id:uid(),exam:"NEET",name:"Biology",chapters:[{id:uid(),name:"The Living World",topics:["Taxonomy","Nomenclature"]},{id:uid(),name:"Cell: The Unit of Life",topics:["Cell Structure","Organelles"]}]}
  ],
  settings:{notifications:true,reminderMinutes:10},
  app:{guideVersion:0}
 };
}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||defaultState()}catch{return defaultState()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function user(){return state.users.find(u=>u.id===state.sessionUserId)}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.remove("hidden");clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.add("hidden"),2200)}
function modal(html){const m=document.getElementById("modal");m.innerHTML=`<div class="modalbox">${html}</div>`;m.classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function setTheme(){
 let t=state.theme;if(t==="system")t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
 document.documentElement.dataset.theme=t;
}
setTheme();

async function derive(password,salt){
 const enc=new TextEncoder();
 const key=await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveBits"]);
 const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(salt),iterations:150000,hash:"SHA-256"},key,256);
 return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function hashPassword(p,s){return derive(p,s)}
function validEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)}
function passwordOK(p){return p.length>=8}
function greeting(){const h=new Date().getHours();return h<12?"Good morning":h<17?"Good afternoon":"Good evening"}
function currentUserData(){const u=user();return u||null}

function signOut(){state.sessionUserId=null;save();page="home";render()}
function startApp(){if(!state.sessionUserId)renderAuth();else render()}

function renderAuth(){
 document.getElementById("app").innerHTML=`
 <div class="auth-wrap"><div class="auth-card">
  <div class="logo">APEX</div><div class="tag">Your Exam Partner.</div>
  <div style="height:20px"></div>
  <div class="tabs"><button class="tab active" id="loginTab">Login</button><button class="tab" id="signupTab">Sign Up</button></div>
  <div id="authForm"></div>
  <p class="small muted" style="margin-top:18px">Local-first build • No Google Sign-In</p>
 </div></div>`;
 document.getElementById("loginTab").onclick=()=>authForm("login");
 document.getElementById("signupTab").onclick=()=>authForm("signup");
 authForm("login");
}
function authForm(type){
 document.querySelectorAll(".tabs .tab").forEach((b,i)=>b.classList.toggle("active",(type==="login"&&i===0)||(type==="signup"&&i===1)));
 const box=document.getElementById("authForm");
 if(type==="login")box.innerHTML=`
  <form id="loginForm">
   <div class="field"><label>Email or username</label><input id="loginId" required autocomplete="username"></div>
   <div class="field"><label>Password</label><input id="loginPass" type="password" required autocomplete="current-password"></div>
   <button class="btn primary" style="width:100%">Login</button>
   <button type="button" class="btn ghost" style="width:100%;margin-top:5px" id="forgot">Forgot password?</button>
  </form>`;
 else box.innerHTML=`
  <form id="signupForm">
   <div class="field"><label>Full name</label><input id="full" required maxlength="80"></div>
   <div class="field"><label>Custom User ID</label><input id="uname" required pattern="[A-Za-z0-9_]{3,24}" maxlength="24"></div>
   <div class="field"><label>Email</label><input id="email" type="email" required></div>
   <div class="field"><label>Password</label><input id="pass" type="password" minlength="8" required autocomplete="new-password"><span class="small muted">At least 8 characters.</span></div>
   <div class="field"><label>Exam</label><select id="exam"><option>JEE</option><option>NEET</option></select></div>
   <div class="field"><label>Grade / Class</label><input id="grade" required placeholder="11th"></div>
   <div class="field"><label>Profile photo (optional)</label><input id="photo" type="file" accept="image/*"></div>
   <button class="btn primary" style="width:100%">Create account</button>
  </form>`;
 if(type==="login"){
  document.getElementById("loginForm").onsubmit=async e=>{e.preventDefault();await login()};
  document.getElementById("forgot").onclick=forgotPassword;
 }else document.getElementById("signupForm").onsubmit=async e=>{e.preventDefault();await signup()};
}
async function signup(){
 const full=fullEl().value.trim(),uname=el("uname").value.trim(),email=el("email").value.trim().toLowerCase(),pass=el("pass").value,exam=el("exam").value,grade=el("grade").value.trim();
 if(!validEmail(email)||!passwordOK(pass))return toast("Use a valid email and 8+ character password.");
 if(state.users.some(u=>u.email===email))return toast("An account with this email already exists.");
 if(state.users.some(u=>u.username.toLowerCase()===uname.toLowerCase()))return toast("That User ID is already taken.");
 let photo="";
 const file=el("photo").files[0];
 if(file){if(file.size>1500000)return toast("Profile photo must be under 1.5 MB.");photo=await readDataURL(file)}
 const salt=uid(),hash=await hashPassword(pass,salt);
 const u={id:uid(),fullName:full,username:uname,email,passwordHash:hash,passwordSalt:salt,exam,grade,photo,createdAt:nowISO(),updatedAt:nowISO(),onboarded:false};
 state.users.push(u);state.sessionUserId=u.id;save();
 showReferral();
}
async function login(){
 const id=el("loginId").value.trim().toLowerCase(),pass=el("loginPass").value;
 const u=state.users.find(x=>x.email===id||x.username.toLowerCase()===id);
 if(!u)return toast("Account not found.");
 if(!(await hashPassword(pass,u.passwordSalt)===u.passwordHash))return toast("Incorrect password. Please try again.");
 state.sessionUserId=u.id;u.lastLoginAt=nowISO();save();render();
}
function forgotPassword(){
 modal(`<h2>Forgot password</h2>
 <p class="muted">This single-file offline build cannot securely email a password-reset link. A production deployment must connect this flow to a backend email service.</p>
 <p>You can still use <b>Change Password</b> after logging in on a device where the session is already available.</p>
 <button class="btn secondary" onclick="closeModal()">Close</button>`);
}
function showReferral(){
 modal(`<h2>Have a referral code?</h2><p class="muted">Optional. You can skip this and continue normally.</p>
 <div class="field"><label>Referral code</label><input id="refCode" maxlength="32" placeholder="Enter code"></div>
 <div class="actions"><button class="btn primary" onclick="applyReferral()">Apply</button><button class="btn secondary" onclick="skipReferral()">Skip</button></div>`);
}
function applyReferral(){
 const code=el("refCode").value.trim().toUpperCase();
 if(!code)return toast("Enter a referral code.");
 // No fake referral validation: local build only accepts codes configured in state.referrals as admin-created records.
 const r=state.referrals.find(x=>x.code===code&&x.active!==false&&(!x.expiresAt||x.expiresAt>=localDate()));
 if(!r)return toast("Referral code not found.");
 const u=user();if(r.usedBy?.includes(u.id))return toast("This referral was already used.");
 r.usedBy=r.usedBy||[];r.usedBy.push(u.id);u.referralCode=code;save();closeModal();showGuide();
}
function skipReferral(){user().referralSkipped=true;save();closeModal();showGuide()}
function showGuide(){
 modal(`<h2>Take the APEX app usage guide in 2 minutes.</h2>
 <div class="list">
 ${["✅ To-Do — plan and complete daily work","📚 Study — browse exam subjects and chapters","📝 Tests — attempt tests and review performance","📦 Backlog — turn pending lectures/DPPs into actionable work","📈 Progress — see real activity and study time","🏆 Gamification — earn XP for meaningful activity","👤 Profile — manage your account and preferences","🔔 Notifications — receive local reminders and announcements"].map(x=>`<div class="card">${x}</div>`).join("")}
 </div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="finishGuide()">Start / Finish Guide</button><button class="btn secondary" onclick="finishGuide()">Skip</button></div>`);
}
function finishGuide(){user().onboarded=true;state.app.guideVersion=1;save();closeModal();render()}

function el(id){return document.getElementById(id)} function fullEl(){return el("full")}
function readDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}

function render(){
 if(!user())return renderAuth();
 setTheme();
 document.getElementById("app").innerHTML=`<div class="screen" id="screen"></div><div class="bottom"><div class="nav">
 ${nav("home","⌂","Home")}${nav("study","📚","Study")}${nav("tests","📝","Tests")}${nav("notes","🗒","Notes")}${nav("profile","👤","Profile")}
 </div></div>`;
 document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
 if(page==="home")homePage();if(page==="study")studyPage();if(page==="tests")testsPage();if(page==="notes")notesPage();if(page==="profile")profilePage();
}
function nav(p,i,t){return `<button data-page="${p}" class="${page===p?"active":""}"><span class="ni">${i}</span>${t}</button>`}
function header(title,sub=""){return `<header class="page"><div class="between"><div><h1>${title}</h1>${sub?`<div class="muted">${sub}</div>`:""}</div><div class="row"><button class="iconbtn" onclick="notificationPage()">🔔</button><div class="avatar" onclick="page='profile';render()">${user().photo?`<img src="${user().photo}">`:esc(user().fullName[0].toUpperCase())}</div></div></div></header>`}

function todayTasks(){return state.tasks.filter(t=>t.userId===user().id&&t.date===localDate())}
function xpTotal(){return state.xp.filter(x=>x.userId===user().id).reduce((a,x)=>a+x.amount,0)}
function activityFor(d){return state.activities.find(a=>a.userId===user().id&&a.date===d)}
function currentStreak(){
 let d=new Date(),n=0;
 while(true){const s=localDate(d),a=activityFor(s);if(!a||a.meaningful<=0)break;n++;d.setDate(d.getDate()-1)}
 return n
}
function bestStreak(){
 const dates=state.activities.filter(a=>a.userId===user().id&&a.meaningful>0).map(a=>a.date).sort();
 let best=0,cur=0,prev="";
 for(const d of dates){if(prev){const x=new Date(prev+"T00:00:00"),y=new Date(d+"T00:00:00");const diff=Math.round((y-x)/86400000);cur=diff===1?cur+1:1}else cur=1;best=Math.max(best,cur);prev=d}return best
}
function markMeaningful(date,delta){
 let a=activityFor(date);if(!a){a={id:uid(),userId:user().id,date,meaningful:0,studyMinutes:0,tasksCompleted:0,backlogCompleted:0,testsCompleted:0};state.activities.push(a)}
 a.meaningful=Math.max(0,a.meaningful+delta);save()
}
function award(source,sourceId,amount){
 const key=`${user().id}:${source}:${sourceId}`;
 if(state.xp.some(x=>x.key===key))return false;
 state.xp.push({id:uid(),userId:user().id,source,sourceId,amount,key,createdAt:nowISO()});return true
}

function homePage(){
 const tasks=todayTasks(),done=tasks.filter(t=>t.status==="COMPLETED").length,mins=state.sessions.filter(s=>s.userId===user().id&&s.date===localDate()).reduce((a,s)=>a+s.minutes,0);
 const backlog=state.backlog.filter(b=>b.userId===user().id),remaining=backlog.reduce((a,b)=>a+Math.max(0,b.lecturesTotal-b.lecturesCompleted)+Math.max(0,b.dppsTotal-b.dppsCompleted)+Math.max(0,b.homeworkTotal-b.homeworkCompleted),0);
 const pct=tasks.length?Math.round(done/tasks.length*100):0;
 el("screen").innerHTML=`
 ${header("Home")}
 <div class="section"><div class="greeting">${greeting()}, ${esc(user().fullName.split(" ")[0])} 👋</div><div class="muted">Keep going. Your goals are closer than you think.</div></div>
 <div class="grid g4">
  ${stat("🔥",currentStreak(),"Current streak")}${stat("⭐",xpTotal(),"XP points")}${stat("⏱",fmtMin(mins),"Study today")}${stat("✓",`${done}/${tasks.length}`,"Tasks done")}
 </div>
 <div class="section card"><div class="between"><div><b>Today's progress</b><div class="small muted">${done} completed • ${tasks.length-done} remaining</div></div><b>${pct}%</b></div><div class="progress" style="margin-top:12px"><i style="width:${pct}%"></i></div></div>
 <div class="section"><div class="between"><h2>Quick actions</h2></div><div class="grid g2">
 ${quick("✓","To-Do","Plan today's work",()=>todoPage())}${quick("📚","Study","Subjects & chapters",()=>{page="study";render()})}
 ${quick("📝","Tests","Practice & history",()=>{page="tests";render()})}${quick("📦","Backlog",`${remaining} work items remaining`,()=>backlogPage())}
 ${quick("📈","Progress","See your real activity",()=>progressPage())}${quick("🏆","Gamification",`${xpTotal()} XP • best ${bestStreak()} days`,()=>gamificationPage())}
 </div></div>
 <div class="section"><div class="between"><h2>Today's tasks</h2><button class="btn secondary" onclick="todoPage()">View all</button></div>
 ${tasks.length?`<div class="list">${tasks.slice(0,5).map(taskCard).join("")}</div>`:`<div class="card empty">No tasks planned for today.<br><button class="btn primary" style="margin-top:12px" onclick="openTask()">Add your first task</button></div>`}</div>`;

 const obj={title:el("tt").value.trim(),subject:el("ts").value,chapter:el("tc").value.trim(),date:el("td").value,startTime:el("tst").value,endTime:el("tet").value,estimatedMinutes:+el("tm").value||0,priority:el("tp").value,notes:el("tn").value.trim()};

 if(obj.startTime&&obj.endTime&&obj.endTime<obj.startTime)return toast("End time must be after start time.");
 if(id){Object.assign(state.tasks.find(t=>t.id===id),obj,{updatedAt:nowISO()})}else state.tasks.push({id:uid(),userId:user().id,status:"PENDING",createdAt:nowISO(),updatedAt:nowISO(),...obj});
 save();closeModal();toast("Task saved");page==="home"?render():todoPage();
}

 return `<div class="card"><div class="between"><div><b>${esc(b.chapter||b.topic||"Backlog")}</b><div class="small muted">${esc(b.subject)}${b.topic?" • "+esc(b.topic):""}</div></div><span class="badge ${b.priority==="HIGH"?"high":b.priority==="LOW"?"low":"med"}">${b.priority}</span></div>
 <div class="small muted" style="margin:12px 0">Lectures ${b.lecturesCompleted||0}/${b.lecturesTotal||0} • DPPs ${b.dppsCompleted||0}/${b.dppsTotal||0} • HW ${b.homeworkCompleted||0}/${b.homeworkTotal||0}</div>

function saveBacklog(id){
 const o={subject:el("bs").value,chapter:el("bc").value.trim(),topic:el("bt").value.trim(),lecturesTotal:+el("bl").value||0,dppsTotal:+el("bd").value||0,homeworkTotal:+el("bh").value||0,estimatedMinutes:+el("bem").value||0,deadline:el("bdeadline").value,priority:el("bp").value};
 if(!o.chapter)return toast("Chapter is required.");
 if(id){Object.assign(state.backlog.find(x=>x.id===id),o,{updatedAt:nowISO()})}
 else state.backlog.push({id:uid(),userId:user().id,lecturesCompleted:0,dppsCompleted:0,homeworkCompleted:0,status:"PENDING",createdAt:nowISO(),updatedAt:nowISO(),...o});

function progressBacklog(id){
 const b=state.backlog.find(x=>x.id===id);
 modal(`<h2>Update progress</h2><p class="muted">${esc(b.chapter)}</p>
 <div class="grid g3">${["lectures","dpps","homework"].map((x,i)=>`<div class="field"><label>${x.toUpperCase()} done</label><input id="p${i}" type="number" min="0" max="${b[x+"Total"]||0}" value="${b[x+"Completed"]||0}"></div>`).join("")}</div>
 <div class="actions"><button class="btn primary" onclick="saveBackProgress('${id}')">Save</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`);

function saveBackProgress(id){
 const b=state.backlog.find(x=>x.id===id),before=bRemaining(b);
 b.lecturesCompleted=Math.min(b.lecturesTotal,+el("p0").value||0);b.dppsCompleted=Math.min(b.dppsTotal,+el("p1").value||0);b.homeworkCompleted=Math.min(b.homeworkTotal,+el("p2").value||0);
 b.status=bRemaining(b)===0?"COMPLETED":"PENDING";b.updatedAt=nowISO();
 const after=bRemaining(b),completedDelta=Math.max(0,before-after);
 if(completedDelta){markMeaningful(localDate(),1);award("BACKLOG_PROGRESS",b.id+"-"+(before-after),30)}
 save();closeModal();toast(b.status==="COMPLETED"?"+30 XP • Backlog completed":"Backlog updated");backlogPage();
}

function addSampleTest(){
 const t={id:uid(),title:"JEE Physics — NLM Quick Test",type:"Chapter-wise",durationMinutes:10,marksPerCorrect:4,negativePerWrong:1,questions:[
  {id:uid(),text:"If net force on a body is zero, its acceleration is:",options:["Zero","Always 9.8 m/s²","Infinite","Cannot be determined"],answer:0,topic:"NLM"},
  {id:uid(),text:"The SI unit of force is:",options:["Joule","Newton","Watt","Pascal"],answer:1,topic:"NLM"},
  {id:uid(),text:"Newton's second law relates force to:",options:["Mass × acceleration","Mass × velocity","Energy × time","Power × distance"],answer:0,topic:"NLM"}
 ],createdAt:nowISO()};state.tests.push(t);save();toast("Test added");testsPage();

function startTest(id){
 const t=state.tests.find(x=>x.id===id),answers={},started=Date.now();
 modal(`<div class="between"><h2>${esc(t.title)}</h2><span class="badge" id="timer">--:--</span></div><p class="muted small">Choose one answer for each question. Submit when finished.</p>
 <div id="questionBox" class="list">${t.questions.map((q,i)=>`<div class="card"><b>Q${i+1}. ${esc(q.text)}</b><div style="margin-top:10px" class="list">${q.options.map((o,j)=>`<label class="card" style="padding:10px"><input type="radio" name="q${i}" value="${j}"> ${esc(o)}</label>`).join("")}</div></div>`).join("")}</div>
 <button class="btn primary" style="margin-top:14px;width:100%" onclick="submitTest('${id}',${started})">Submit test</button>`);
 let sec=t.durationMinutes*60;window.__timer=setInterval(()=>{sec--;if(el("timer"))el("timer").textContent=`${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;if(sec<=0){clearInterval(window.__timer);if(el("timer"))el("timer").textContent="Time";}},1000);
}
function submitTest(id,started){
 clearInterval(window.__timer);const t=state.tests.find(x=>x.id===id);let correct=0,wrong=0,un=0,topics={};
 t.questions.forEach((q,i)=>{const a=document.querySelector(`input[name=q${i}]:checked`);if(!a){un++;return}const ok=+a.value===q.answer;if(ok)correct++;else wrong++;topics[q.topic]=(topics[q.topic]||0)+(ok?1:-1)});
 const score=correct*t.marksPerCorrect-wrong*t.negativePerWrong,maxScore=t.questions.length*t.marksPerCorrect,accuracy=t.questions.length?Math.round(correct/t.questions.length*100):0;
 const a={id:uid(),userId:user().id,testId:id,startedAt:new Date(started).toISOString(),submittedAt:nowISO(),score,maxScore,correct,wrong,unattempted:un,accuracy,timeTakenSeconds:Math.round((Date.now()-started)/1000),topics};
 state.attempts.push(a);markMeaningful(localDate(),1);award("TEST_COMPLETED",a.id,20);save();closeModal();
 modal(`<h2>Test result</h2><div class="grid g2">${stat("🎯",score+"/"+maxScore,"Score")}${stat("✓",correct,"Correct")}${stat("✕",wrong,"Incorrect")}${stat("—",un,"Unattempted")}</div><div class="card" style="margin-top:12px"><b>Accuracy ${accuracy}%</b><div class="progress" style="margin-top:8px"><i style="width:${accuracy}%"></i></div><p class="small muted">Time taken: ${fmtMin(Math.round(a.timeTakenSeconds/60))}</p></div><button class="btn primary" style="margin-top:12px" onclick="closeModal();testsPage()">Done</button>`);
}

 const tests=state.attempts.filter(a=>a.userId===uidv);
 el("screen").innerHTML=`${header("Progress","Analytics based only on your recorded activity")}
 <div class="grid g3">${stat("⏱",fmtMin(study7),"Study time • 7 days")}${stat("📅",fmtMin(study30),"Study time • 30 days")}${stat("✓",completed,"Tasks completed")}${stat("📦",state.backlog.filter(b=>b.userId===uidv&&b.status==="COMPLETED").length,"Backlog completed")}${stat("📝",tests.length,"Tests attempted")}${stat("🔥",currentStreak(),"Current streak")}</div>
 <div class="section card"><div class="between"><b>Recent activity</b><span class="small muted">${acts.length} active days recorded</span></div><div style="margin-top:12px">${acts.slice(0,14).map(a=>`<div class="between" style="padding:9px 0;border-bottom:1px solid var(--border)"><span>${dateText(a.date)}</span><span class="small muted">${a.tasksCompleted||0} tasks • ${a.studyMinutes||0}m study • ${a.meaningful} meaningful</span></div>`).join("")||`<div class="empty">Start studying to create your first activity record.</div>`}</div></div>
 <div class="section card"><b>Study time</b><div class="small muted" style="margin:7px 0">You can record a completed session below.</div><button class="btn primary" onclick="recordStudy()">+ Record study session</button></div>`;
}
function recordStudy(){
 modal(`<h2>Record study session</h2><form id="studyForm"><div class="grid g2"><div class="field"><label>Date</label><input id="sd" type="date" value="${localDate()}" required></div><div class="field"><label>Minutes</label><input id="sm" type="number" min="1" max="1440" value="60" required></div></div><div class="field"><label>Subject</label><select id="ss">${subjectList(user().exam).map(s=>`<option>${s}</option>`).join("")}</select></div><div class="field"><label>Chapter / topic</label><input id="sch"></div><div class="actions"><button class="btn primary">Save session</button><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button></div></form>`);
 el("studyForm").onsubmit=e=>{e.preventDefault();const date=el("sd").value,mins=+el("sm").value;state.sessions.push({id:uid(),userId:user().id,date,minutes:mins,subject:el("ss").value,chapter:el("sch").value.trim(),createdAt:nowISO()});let a=activityFor(date);if(!a){a={id:uid(),userId:user().id,date,meaningful:0,studyMinutes:0,tasksCompleted:0,backlogCompleted:0,testsCompleted:0};state.activities.push(a)}a.meaningful++;a.studyMinutes+=mins;award("STUDY_SESSION",state.sessions.at(-1).id,20);save();closeModal();toast("+20 XP • Study session recorded");progressPage()}
}
function gamificationPage(){
 const xp=xpTotal(),st=currentStreak(),best=bestStreak(),tasks=state.tasks.filter(t=>t.userId===user().id&&t.status==="COMPLETED").length,backs=state.backlog.filter(b=>b.userId===user().id&&b.status==="COMPLETED").length,tests=state.attempts.filter(a=>a.userId===user().id).length;
 const ach=[["🔥","7-day streak",st>=7],["📚","10 chapters / backlog items completed",backs>=10],["🎯","100 tasks completed",tasks>=100],["🏆","10 tests completed",tests>=10]];
 el("screen").innerHTML=`${header("Gamification","Earn XP from meaningful academic actions")}
 <div class="grid g3">${stat("⭐",xp,"XP")}${stat("🔥",st,"Current streak")}${stat("🏅",best,"Best streak")}</div>
 <div class="section card"><b>Achievements</b><div class="list" style="margin-top:10px">${ach.map(a=>`<div class="between card" style="box-shadow:none"><span>${a[0]} ${a[1]}</span><span class="badge">${a[2]?"Unlocked":"Locked"}</span></div>`).join("")}</div></div>
 <div class="section card"><b>XP rules</b><p class="small muted">Task +10 • Study session +20 • Test +20 • Completed backlog item +30. XP awards are idempotent so repeating the same event does not repeatedly award points.</p></div>`;
}

function profilePage(){
 el("screen").innerHTML=`${header("Profile","Your APEX account")}
 <div class="card"><div class="row"><div class="avatar" style="width:70px;height:70px">${user().photo?`<img src="${user().photo}">`:esc(user().fullName[0].toUpperCase())}</div><div><h2 style="margin:0">${esc(user().fullName)}</h2><div class="muted">@${esc(user().username)}</div><div class="small muted">${esc(user().exam)} • ${esc(user().grade)}</div></div></div></div>
 <div class="section grid g2">
 ${profileAction("✏️","Edit profile","Update name, grade or photo",editProfile)}${profileAction("⚙️","Settings","Theme and preferences",settingsPage)}
 ${profileAction("🔐","Change password","Update your local password",changePassword)}${profileAction("🔔","Notifications","Reminder preferences",notificationSettings)}
 ${profileAction("📈","Progress","Your study statistics",progressPage)}${profileAction("🏆","Achievements","XP and streaks",gamificationPage)}
 ${profileAction("🔗","Referral code","Your referral status",()=>modal(`<h2>Referral</h2><p class="muted">${user().referralCode?`Used code: <b>${esc(user().referralCode)}</b>`:"No referral code used."}</p><button class="btn secondary" onclick="closeModal()">Close</button>`))}
 ${profileAction("🆘","Help & Support","Offline build information",helpPage)}
 </div><button class="btn danger" style="width:100%" onclick="signOut()">Logout</button>`;
}
function profileAction(i,t,s,fn){return `<button class="card quick" onclick="(${fn.toString()})()"><span class="qicon">${i}</span><span style="text-align:left"><b>${t}</b><br><span class="small muted">${s}</span></span></button>`}
function editProfile(){
 modal(`<h2>Edit profile</h2><form id="pf"><div class="field"><label>Full name</label><input id="pn" value="${esc(user().fullName)}" required></div><div class="field"><label>Grade</label><input id="pg" value="${esc(user().grade)}" required></div><div class="field"><label>Profile photo</label><input id="pp" type="file" accept="image/*"></div><div class="actions"><button class="btn primary">Save</button><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button></div></form>`);
 el("pf").onsubmit=async e=>{e.preventDefault();user().fullName=el("pn").value.trim();user().grade=el("pg").value.trim();const f=el("pp").files[0];if(f){if(f.size>1500000)return toast("Photo must be under 1.5 MB.");user().photo=await readDataURL(f)}user().updatedAt=nowISO();save();closeModal();profilePage();toast("Profile updated")}
}
function changePassword(){
 modal(`<h2>Change password</h2><form id="cp"><div class="field"><label>Current password</label><input id="oldp" type="password" required></div><div class="field"><label>New password</label><input id="newp" type="password" minlength="8" required></div><div class="actions"><button class="btn primary">Change password</button><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button></div></form>`);
 el("cp").onsubmit=async e=>{e.preventDefault();if(!(await hashPassword(el("oldp").value,user().passwordSalt)===user().passwordHash))return toast("Incorrect current password.");if(!passwordOK(el("newp").value))return toast("New password must be 8+ characters.");user().passwordSalt=uid();user().passwordHash=await hashPassword(el("newp").value,user().passwordSalt);user().updatedAt=nowISO();save();closeModal();toast("Password changed")}
}
function settingsPage(){
 modal(`<h2>Settings</h2><div class="list">
 <div class="card"><b>Theme</b><div class="actions" style="margin-top:10px">${["light","dark","system"].map(t=>`<button class="btn ${state.theme===t?"primary":"secondary"}" onclick="state.theme='${t}';save();setTheme();settingsPage()">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div></div>
 <div class="card"><b>Notifications</b><div class="small muted">Local reminders can work while this page/app is available. Reliable Android background push requires a native notification service/backend.</div><button class="btn secondary" style="margin-top:10px" onclick="notificationSettings()">Configure</button></div>
 <div class="card"><b>Privacy & Security</b><p class="small muted">APEX stores local data in this browser/app wrapper. Passwords are stored as PBKDF2-derived hashes, not plaintext. Do not treat client-only admin controls as secure.</p></div>
 <div class="card"><b>App version</b><div class="small muted">APEX ${VERSION}</div></div>
 </div><button class="btn secondary" onclick="closeModal()">Close</button>`);
}
function notificationSettings(){
 modal(`<h2>Notification settings</h2><form id="nf"><label class="row"><input id="nen" type="checkbox" ${state.settings.notifications?"checked":""}> Enable reminders</label><div class="field"><label>Reminder before task (minutes)</label><input id="nmin" type="number" min="0" max="120" value="${state.settings.reminderMinutes}"></div><button class="btn primary">Save</button></form>`);
 el("nf").onsubmit=e=>{e.preventDefault();state.settings.notifications=el("nen").checked;state.settings.reminderMinutes=Math.max(0,+el("nmin").value||0);save();closeModal();toast("Notification settings saved")}
}
function helpPage(){
 modal(`<h2>APEX Help & Support</h2><p>Core productivity data is local-first in this single-file edition.</p><p class="small muted">For a production release, connect a backend for secure multi-device synchronization, email password reset, server-side admin RBAC, cloud attachments and reliable push notifications.</p><button class="btn secondary" onclick="closeModal()">Close</button>`)
}

/* Scheduled local reminder checker. It avoids repeat spam by storing reminder keys. */
setInterval(()=>{
 if(!state.sessionUserId||!state.settings.notifications)return;
 const now=new Date(), today=localDate(now);
 state.tasks.filter(t=>t.userId===user().id&&t.date===today&&t.status!=="COMPLETED"&&t.startTime).forEach(t=>{
  const [h,m]=t.startTime.split(":").map(Number),target=new Date();target.setHours(h,m,0,0);
  const diff=Math.round((target-now)/60000),key=`rem:${t.id}:${today}`;
  if(diff<=state.settings.reminderMinutes&&diff>=0&&!localStorage.getItem(key)){
   localStorage.setItem(key,"1");state.notifications.push({id:uid(),userId:user().id,title:`${t.subject||"Study"} — ${t.title}`,body:"Your scheduled study session is starting.",createdAt:nowISO()});save();toast(`🔔 ${t.title}`);
   if("Notification"in window&&Notification.permission==="granted")new Notification(`APEX • ${t.subject||"Study"}`,{body:`${t.title} is starting.`});
  }
 })
},30000);

function requestNotifications(){if("Notification"in window&&Notification.permission==="default")Notification.requestPermission().catch(()=>{})}

/* Admin is intentionally not implemented as a fake client-side password area.
   A secure admin panel must use server-side RBAC. The local data model can be
   migrated to the backend later. */
window.APEX={state,save,version:VERSION};

document.addEventListener("click",e=>{if(e.target.matches(".modal"))closeModal()});
startApp();
</script>
</body>
</html>
