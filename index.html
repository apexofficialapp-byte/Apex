<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>APEX — Your Exam Partner</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#101828;--muted:#667085;--primary:#5b5cf0;--primary2:#7c3aed;--line:#e5e7eb;--ok:#12b76a;--danger:#ef4444;--shadow:0 10px 30px #10182812}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}
#app{min-height:100vh}.screen{min-height:100vh}.center{display:grid;place-items:center;padding:24px}
.splash{background:linear-gradient(145deg,#0b1020,#25236b);color:white;text-align:center}.logo{width:74px;height:74px;border-radius:22px;background:linear-gradient(135deg,#fff,#b8b8ff);color:#24245f;display:grid;place-items:center;font-size:34px;font-weight:900;margin:auto;box-shadow:0 18px 50px #0005}
.splash h1{font-size:40px;margin:18px 0 4px}.splash p{opacity:.8}.loader{margin:30px auto 0;width:150px;height:5px;border-radius:99px;background:#ffffff25;overflow:hidden}.loader i{display:block;width:45%;height:100%;background:white;border-radius:99px;animation:load 1.3s infinite}@keyframes load{to{transform:translateX(240%)}} 
.auth{max-width:430px;width:100%}.auth-card,.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.auth-card{padding:28px}.brand{text-align:center;margin-bottom:22px}.brand b{font-size:28px}.tabs{display:flex;background:#f1f3f8;padding:4px;border-radius:12px;margin-bottom:18px}.tabs button{flex:1;padding:10px;border-radius:9px;background:transparent}.tabs .active{background:white;box-shadow:0 2px 8px #00000012;font-weight:700}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:none;background:#fff}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px #5b5cf015}.primary{width:100%;padding:13px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;font-weight:800;margin-top:8px}.ghost{background:#f2f4f7;padding:10px 13px;border-radius:10px}.danger{color:var(--danger)}.small{font-size:12px;color:var(--muted)}
.app-shell{max-width:1100px;margin:auto;min-height:100vh;padding-bottom:88px}.topbar{height:66px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}.topbar .title{font-weight:900;font-size:20px}.iconbtn{width:40px;height:40px;border-radius:12px;background:#f2f4f7}.content{padding:18px}.page{display:none}.page.active{display:block}.hero{padding:22px;border-radius:24px;background:linear-gradient(135deg,#15194d,#5b5cf0);color:white;box-shadow:var(--shadow);margin-bottom:16px}.hero h2{margin:0 0 5px;font-size:25px}.hero p{margin:0;opacity:.82}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.chip{background:#ffffff1a;border:1px solid #ffffff25;padding:8px 10px;border-radius:999px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:16px}.stat b{font-size:24px}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.section-title h3{margin:0}.list{display:grid;gap:10px}.row{display:flex;align-items:center;gap:12px}.task{display:flex;align-items:center;gap:12px}.check{width:24px;height:24px;border:2px solid #cbd5e1;border-radius:7px;background:white}.check.done{background:var(--ok);border-color:var(--ok);color:white}.task-main{flex:1}.task-main b{display:block}.task-main small{color:var(--muted)}.progress{height:8px;background:#edf0f5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:99px}.feature{display:flex;align-items:center;gap:12px}.feature .ico{width:44px;height:44px;border-radius:14px;background:#eef0ff;display:grid;place-items:center;font-size:21px}.bottom{position:fixed;bottom:0;left:0;right:0;height:72px;background:#ffffffed;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:30}.bottom-inner{width:min(1100px,100%);display:grid;grid-template-columns:repeat(5,1fr)}.nav{background:transparent;color:#667085;font-size:11px}.nav.active{color:var(--primary);font-weight:800}.nav span{display:block;font-size:21px;margin-bottom:2px}.modal{position:fixed;inset:0;background:#10182880;display:grid;place-items:center;padding:18px;z-index:50}.modal-box{width:min(460px,100%);background:white;border-radius:24px;padding:22px;box-shadow:0 30px 80px #0004}.modal-box h2{margin-top:0}.actions{display:flex;gap:10px;margin-top:16px}.actions button{flex:1}.notice{padding:12px;border-radius:12px;background:#eef4ff;color:#344054;font-size:13px;margin:10px 0}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#111827;color:white;padding:11px 15px;border-radius:12px;z-index:80;box-shadow:var(--shadow);font-size:13px}.avatar{width:48px;height:48px;border-radius:50%;background:#e9e8ff;display:grid;place-items:center;font-weight:900;color:#4f46e5}.empty{text-align:center;padding:30px;color:var(--muted)}@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}.content{padding:28px}.bottom{position:fixed}.auth-card{padding:34px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY='apex_v1';
const state=JSON.parse(localStorage.getItem(KEY)||'null')||{
 users:[],session:null,tasks:[],backlog:[],notes:[],study:[],tests:[],xp:0,streak:0,lastActive:null,
 settings:{theme:'light',notifications:true},onboarded:false,referral:null
};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const user=()=>state.users.find(u=>u.id===state.session);
const toast=m=>{let t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)};
function app(){ if(!state.session) return auth(); shell(); }
function auth(){
 $('#app').innerHTML=`<div class="screen center"><div class="auth-card auth">
 <div class="brand"><div class="logo" style="width:58px;height:58px;font-size:27px">A</div><b>APEX</b><div class="small">Your Exam Partner.</div></div>
 <div class="tabs"><button class="active" id="loginTab">Login</button><button id="signupTab">Sign Up</button></div>
 <form id="authForm">
 <div id="signupFields"></div>
 <div class="field"><label>Email or User ID</label><input id="loginId" required autocomplete="username"></div>
 <div class="field"><label>Password</label><input id="loginPass" type="password" required autocomplete="current-password"></div>
 <button class="primary">Login</button>
 </form>
 <p class="small" style="text-align:center;margin-top:15px">Google Login has been completely removed.</p>
 </div></div>`;
 let signup=false;
 $('#loginTab').onclick=()=>setMode(false); $('#signupTab').onclick=()=>setMode(true);
 function setMode(v){
   signup=v;$('#loginTab').classList.toggle('active',!v);$('#signupTab').classList.toggle('active',v);
   $('#signupFields').innerHTML=v?`<div class="field"><label>Full name</label><input id="name" required></div>
   <div class="field"><label>Custom User ID</label><input id="custom" required></div>
   <div class="field"><label>Exam</label><select id="exam"><option>JEE</option><option>NEET</option></select></div>
   <div class="field"><label>Grade</label><input id="grade" placeholder="e.g. 11"></div>`:'';
   $('#authForm').querySelector('button').textContent=v?'Create account':'Login';
 }
 $('#authForm').onsubmit=e=>{e.preventDefault();
   const id=$('#loginId').value.trim(), pass=$('#loginPass').value;
   if(signup){
     const name=$('#name').value.trim(), custom=$('#custom').value.trim(), exam=$('#exam').value, grade=$('#grade').value.trim();
     if(!name||!custom)return toast('Fill all required fields');
     if(state.users.some(u=>u.custom.toLowerCase()===custom.toLowerCase()||u.email.toLowerCase()===id.toLowerCase()))return toast('User ID/email already exists');
     const u={id:uid(),name,custom,email:id,pass,exam,grade,createdAt:Date.now()};
     state.users.push(u);state.session=u.id;state.xp=0;state.streak=0;save();showReferral();return;
   }
   const u=state.users.find(x=>x.email.toLowerCase()===id.toLowerCase()||x.custom.toLowerCase()===id.toLowerCase());
   if(!u||u.pass!==pass)return toast('Incorrect login details');
   state.session=u.id;save();app();
 };
}
function shell(){
 $('#app').innerHTML=`<div class="app-shell"><header class="topbar"><div class="row"><button class="iconbtn" onclick="showProfile()">☰</button><div class="title">APEX</div></div><button class="iconbtn" onclick="showNotifications()">🔔</button></header>
 <main class="content">
 <section id="home" class="page active"></section><section id="study" class="page"></section><section id="tests" class="page"></section><section id="notes" class="page"></section><section id="profile" class="page"></section>
 </main></div>
 <nav class="bottom"><div class="bottom-inner">
 ${[['home','🏠','Home'],['study','📚','Study'],['tests','📝','Tests'],['notes','📒','Notes'],['profile','👤','Profile']].map(x=>`<button class="nav ${x[0]=='home'?'active':''}" data-page="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('')}
 </div></nav>`;
 document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.page));
 renderAll();
}
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===p));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));renderAll();}
function renderAll(){renderHome();renderStudy();renderTests();renderNotes();renderProfile();}
function renderHome(){
 const u=user(),today=new Date().toISOString().slice(0,10),ts=state.tasks.filter(t=>t.date===today),done=ts.filter(t=>t.done).length;
 const bl=state.backlog.filter(x=>!x.done).length,mins=state.study.filter(x=>x.date===today).reduce((a,x)=>a+x.minutes,0);
 $('#home').innerHTML=`<div class="hero"><h2>Hello, ${esc(u.name.split(' ')[0])} 👋</h2><p>Keep going. Your goals are closer than you think.</p><div class="chips"><span class="chip">${u.exam}</span><span class="chip">🔥 ${state.streak} day streak</span><span class="chip">⭐ ${state.xp} XP</span></div></div>
 <div class="grid3"><div class="card stat"><b>${done}/${ts.length}</b><span>Today's tasks</span></div><div class="card stat"><b>${Math.floor(mins/60)}h ${mins%60}m</b><span>Study today</span></div><div class="card stat"><b>${bl}</b><span>Backlog left</span></div></div>
 <div class="section-title"><h3>Quick access</h3></div><div class="grid">${[['📋','To-Do','todo'],['📚','Backlog','backlog'],['🎯','Progress','progress'],['🏆','Gamification','game']].map(x=>`<button class="card feature" onclick="quick('${x[2]}')"><span class="ico">${x[0]}</span><span><b>${x[1]}</b><small class="small">Open ${x[1].toLowerCase()}</small></span></button>`).join('')}</div>
 <div class="section-title"><h3>Today's tasks</h3><button class="ghost" onclick="quick('todo')">+ Add</button></div>
 <div class="list">${ts.length?ts.map(taskHTML).join(''):'<div class="card empty">No tasks for today. Add your first study task.</div>'}</div>`;
}
function taskHTML(t){return `<div class="card task"><button class="check ${t.done?'done':''}" onclick="toggleTask('${t.id}')">${t.done?'✓':''}</button><div class="task-main"><b>${esc(t.title)}</b><small>${esc(t.subject||'General')} · ${esc(t.time||'Any time')}</small></div><button class="iconbtn" onclick="deleteTask('${t.id}')">⋯</button></div>`}
function quick(type){
 if(type==='todo'){modal(`<h2>Today's To-Do</h2><div class="field"><label>Task</label><input id="mTitle" placeholder="e.g. Complete NLM lecture"></div><div class="field"><label>Subject</label><input id="mSubject" placeholder="Physics"></div><div class="field"><label>Date</label><input id="mDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Time</label><input id="mTime" type="time"></div><div class="actions"><button class="ghost" onclick="closeModal()">Cancel</button><button class="primary" onclick="addTask()">Add task</button></div>`);return}
 if(type==='backlog'){modal(`<h2>Add backlog</h2><div class="field"><label>Chapter/topic</label><input id="bTitle" placeholder="e.g. NLM"></div><div class="field"><label>Subject</label><input id="bSubject" placeholder="Physics"></div><div class="field"><label>Items remaining</label><input id="bCount" type="number" min="1" value="1"></div><div class="actions"><button class="ghost" onclick="closeModal()">Cancel</button><button class="primary" onclick="addBacklog()">Add</button></div>`);return}
 if(type==='progress'){modal(`<h2>Progress</h2><div class="grid3"><div class="card stat"><b>${state.tasks.filter(t=>t.done).length}</b><span>Tasks completed</span></div><div class="card stat"><b>${state.tests.length}</b><span>Tests logged</span></div><div class="card stat"><b>${state.xp}</b><span>XP</span></div></div><div class="actions"><button class="primary" onclick="closeModal()">Done</button></div>`);return}
 if(type==='game'){modal(`<h2>Gamification</h2><p>⭐ ${state.xp} XP · 🔥 ${state.streak} day streak</p><div class="notice">Earn XP by completing meaningful study activities. Repeatedly toggling a task won't award points twice.</div><div class="actions"><button class="primary" onclick="closeModal()">Keep going 🚀</button></div>`)}
}
function addTask(){let title=$('#mTitle').value.trim();if(!title)return toast('Enter a task');state.tasks.push({id:uid(),title,subject:$('#mSubject').value.trim(),date:$('#mDate').value,time:$('#mTime').value,done:false,xp:false});save();closeModal();renderAll();toast('Task added')}
function toggleTask(id){let t=state.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;if(t.done&&!t.xp){state.xp+=10;t.xp=true;activity();toast('+10 XP')}save();renderAll()}
function deleteTask(id){state.tasks=state.tasks.filter(x=>x.id!==id);save();renderAll();toast('Task removed')}
function addBacklog(){let title=$('#bTitle').value.trim();if(!title)return toast('Enter a chapter/topic');state.backlog.push({id:uid(),title,subject:$('#bSubject').value.trim(),count:+$('#bCount').value||1,done:false});save();closeModal();renderAll();toast('Backlog added')}
function activity(){let d=new Date().toISOString().slice(0,10);if(state.lastActive!==d){let y=new Date();y.setDate(y.getDate()-1);let yd=y.toISOString().slice(0,10);state.streak=state.lastActive===yd?state.streak+1:1;state.lastActive=d}}
function renderStudy(){
 const bl=state.backlog.filter(x=>!x.done);
 $('#study').innerHTML=`<div class="section-title"><h2>Study</h2><button class="primary" style="width:auto" onclick="startStudy()">+ Session</button></div>
 <div class="grid"><div class="card"><b>Physics</b><div class="progress" style="margin-top:12px"><i style="width:42%"></i></div><small class="small">42% tracked</small></div><div class="card"><b>Chemistry</b><div class="progress" style="margin-top:12px"><i style="width:31%"></i></div><small class="small">31% tracked</small></div><div class="card"><b>Mathematics</b><div class="progress" style="margin-top:12px"><i style="width:28%"></i></div><small class="small">28% tracked</small></div></div>
 <div class="section-title"><h3>Backlog</h3><button class="ghost" onclick="quick('backlog')">+ Add</button></div>
 <div class="list">${bl.length?bl.map(x=>`<div class="card task"><button class="check" onclick="finishBacklog('${x.id}')"></button><div class="task-main"><b>${esc(x.title)}</b><small>${esc(x.subject)} · ${x.count} item(s) remaining</small></div></div>`).join(''):'<div class="card empty">No backlog 🎉</div>'}</div>`;
}
function finishBacklog(id){let x=state.backlog.find(b=>b.id===id);if(!x)return;x.done=true;state.xp+=30;activity();save();renderAll();toast('+30 XP — backlog cleared')}
function startStudy(){modal(`<h2>Study session</h2><div class="field"><label>Subject</label><input id="sSub" placeholder="Physics"></div><div class="field"><label>Minutes studied</label><input id="sMin" type="number" min="1" value="60"></div><div class="actions"><button class="ghost" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveStudy()">Save session</button></div>`)}
function saveStudy(){let m=+$('#sMin').value;if(!m||m<1)return toast('Enter valid minutes');state.study.push({id:uid(),subject:$('#sSub').value.trim(),minutes:m,date:new Date().toISOString().slice(0,10)});state.xp+=20;activity();save();closeModal();renderAll();toast('+20 XP — study session saved')}
function renderTests(){
 $('#tests').innerHTML=`<div class="section-title"><h2>Tests</h2><button class="primary" style="width:auto" onclick="logTest()">+ Log test</button></div>
 <div class="grid3"><div class="card stat"><b>${state.tests.length}</b><span>Tests</span></div><div class="card stat"><b>${state.tests.length?Math.round(state.tests.reduce((a,x)=>a+x.accuracy,0)/state.tests.length):0}%</b><span>Average accuracy</span></div><div class="card stat"><b>${state.tests.reduce((a,x)=>a+x.score,0)}</b><span>Total score</span></div></div>
 <div class="section-title"><h3>Test history</h3></div><div class="list">${state.tests.length?state.tests.slice().reverse().map(t=>`<div class="card"><div class="row"><div class="avatar">🎯</div><div style="flex:1"><b>${esc(t.name)}</b><small class="small">${esc(t.subject)} · ${t.score} marks · ${t.accuracy}% accuracy</small></div></div></div>`).join(''):'<div class="card empty">No tests logged yet.</div>'}</div>`;
}
function logTest(){modal(`<h2>Log a test</h2><div class="field"><label>Test name</label><input id="tName" placeholder="Chapter test"></div><div class="field"><label>Subject</label><input id="tSub" placeholder="Physics"></div><div class="field"><label>Score</label><input id="tScore" type="number" min="0" value="0"></div><div class="field"><label>Accuracy %</label><input id="tAcc" type="number" min="0" max="100" value="0"></div><div class="actions"><button class="ghost" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveTest()">Save</button></div>`)}
function saveTest(){let name=$('#tName').value.trim();if(!name)return toast('Enter test name');state.tests.push({id:uid(),name,subject:$('#tSub').value.trim(),score:+$('#tScore').value||0,accuracy:+$('#tAcc').value||0});state.xp+=15;save();closeModal();renderAll();toast('+15 XP — test saved')}
function renderNotes(){
 $('#notes').innerHTML=`<div class="section-title"><h2>Notes</h2><button class="primary" style="width:auto" onclick="addNote()">+ Note</button></div>
 <div class="field"><input id="noteSearch" placeholder="Search notes..." oninput="renderNoteList()"></div><div id="noteList" class="list"></div>`;
 renderNoteList();
}
function renderNoteList(){let q=($('#noteSearch')?.value||'').toLowerCase();let a=state.notes.filter(n=>(n.title+n.body).toLowerCase().includes(q));$('#noteList').innerHTML=a.length?a.map(n=>`<div class="card"><b>${esc(n.title)}</b><p class="small">${esc(n.body)}</p><button class="ghost danger" onclick="deleteNote('${n.id}')">Delete</button></div>`).join(''):'<div class="card empty">No notes found.</div>'}
function addNote(){modal(`<h2>New note</h2><div class="field"><label>Title</label><input id="nTitle"></div><div class="field"><label>Note</label><textarea id="nBody" rows="6"></textarea></div><div class="actions"><button class="ghost" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveNote()">Save</button></div>`)}
function saveNote(){let title=$('#nTitle').value.trim(),body=$('#nBody').value.trim();if(!title)return toast('Enter a title');state.notes.push({id:uid(),title,body});save();closeModal();renderNotes();toast('Note saved')}
function deleteNote(id){state.notes=state.notes.filter(n=>n.id!==id);save();renderNotes()}
function renderProfile(){const u=user();$('#profile').innerHTML=`<div class="section-title"><h2>Profile</h2></div><div class="card"><div class="row"><div class="avatar">${esc(u.name[0]?.toUpperCase()||'A')}</div><div><h3 style="margin:0">${esc(u.name)}</h3><small class="small">@${esc(u.custom)} · ${esc(u.exam)} · Grade ${esc(u.grade||'-')}</small></div></div></div>
 <div class="section-title"><h3>Account</h3></div><div class="list"><button class="card row" onclick="editProfile()">✏️ <b>Edit profile</b></button><button class="card row" onclick="settings()">⚙️ <b>Settings</b></button><button class="card row" onclick="showNotifications()">🔔 <b>Notifications</b></button><button class="card row" onclick="logout()">🚪 <b class="danger">Logout</b></button></div>
 <div class="section-title"><h3>Your stats</h3></div><div class="grid3"><div class="card stat"><b>${state.xp}</b><span>XP</span></div><div class="card stat"><b>${state.streak}</b><span>Best/current streak</span></div><div class="card stat"><b>${state.tasks.filter(t=>t.done).length}</b><span>Tasks done</span></div></div>`}
function editProfile(){let u=user();modal(`<h2>Edit profile</h2><div class="field"><label>Name</label><input id="pName" value="${esc(u.name)}"></div><div class="field"><label>Grade</label><input id="pGrade" value="${esc(u.grade||'')}"></div><div class="actions"><button class="ghost" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveProfile()">Save</button></div>`)}
function saveProfile(){let u=user();u.name=$('#pName').value.trim()||u.name;u.grade=$('#pGrade').value.trim();save();closeModal();renderAll();toast('Profile updated')}
function settings(){modal(`<h2>Settings</h2><div class="field"><label>Theme</label><select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></div><label class="row"><input id="notif" type="checkbox" ${state.settings.notifications?'checked':''}> Notifications</label><div class="actions"><button class="ghost" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveSettings()">Save</button></div>`);$('#theme').value=state.settings.theme}
function saveSettings(){state.settings.theme=$('#theme').value;state.settings.notifications=$('#notif').checked;document.body.style.filter='';save();closeModal();toast('Settings saved')}
function showProfile(){go('profile')}
function showNotifications(){modal(`<h2>Notifications</h2><div class="notice"><b>Welcome to APEX 🚀</b><br>Your productivity dashboard is ready.</div><div class="notice">Official announcements will appear here when an authorized APEX admin publishes them.</div><div class="actions"><button class="primary" onclick="closeModal()">Done</button></div>`)}
function logout(){state.session=null;save();app()}
function modal(html){let m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=`<div class="modal-box">${html}</div>`;document.body.append(m)}
function closeModal(){document.getElementById('modal')?.remove()}
function showReferral(){modal(`<h2>Have a referral code?</h2><p class="small">Optional. You can skip this and continue using APEX.</p><div class="field"><input id="ref" placeholder="Enter referral code"></div><div class="actions"><button class="ghost" onclick="skipReferral()">Skip</button><button class="primary" onclick="applyReferral()">Apply</button></div>`)}
function skipReferral(){closeModal();showGuide()}
function applyReferral(){let r=$('#ref').value.trim();if(!r)return toast('Enter a code or skip');state.referral=r;save();closeModal();toast('Referral saved');showGuide()}
function showGuide(){modal(`<h2>APEX app guide</h2><p>Take a quick tour of To-Do, Study, Tests, Backlog, Progress, Gamification, Notes and Profile.</p><div class="notice">You can skip this guide and open it later from Help & Support.</div><div class="actions"><button class="ghost" onclick="finishGuide()">Skip</button><button class="primary" onclick="finishGuide()">Start APEX 🚀</button></div>`)}
function finishGuide(){state.onboarded=true;save();closeModal();app()}
setTimeout(()=>{if(!state.session){$('#app').innerHTML=`<div class="screen center splash"><div><div class="logo">A</div><h1>APEX</h1><p>Your Exam Partner.</p><div class="loader"><i></i></div></div></div>`;setTimeout(app,1200)}else app()},200);
</script>
</body>
</html>
